name: Automated Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false  # Continue testing other versions if one fails
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Updated to v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5  # Updated to v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'  # Built-in pip caching
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        
        # Install Chrome
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        
        # Verify Chrome installation
        google-chrome --version
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Create test fixtures
      run: |
        mkdir -p tests/fixtures
        python tests/fixtures/create_test_images.py
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v -m unit --cov=app --cov=src --cov-report=xml --cov-report=term-missing
      continue-on-error: false
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v -m integration
      continue-on-error: false
    
    - name: Run E2E tests (headless)
      run: |
        mkdir -p reports
        pytest tests/e2e/ -v -m "e2e and not selenium" --html=reports/e2e_report.html --self-contained-html
      continue-on-error: true  # E2E tests can be flaky
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4  # Updated to v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}  # Add token for better reliability
      continue-on-error: true  # Don't fail if Codecov is down
    
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        name: test-reports-python-${{ matrix.python-version }}
        path: |
          reports/
          htmlcov/
          coverage.xml
        retention-days: 30
    
    - name: Create test summary
      if: always()
      run: |
        echo "## Test Results 🧪" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Python Version:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check if pytest ran
        if [ -f coverage.xml ]; then
          echo "✅ Tests completed successfully" >> $GITHUB_STEP_SUMMARY
        else