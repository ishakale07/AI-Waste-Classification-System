[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --strict-markers
    --tb=short

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    selenium: Tests requiring Selenium/Chrome
    slow: Slow running tests
    smoke: Smoke tests
    upload: Tests for upload mode
    live: Tests for live camera mode
    analytics: Tests for analytics

[coverage:run]
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False