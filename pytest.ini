[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --strict-markers
    
    --tb=short
    --cov=app
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --html=reports/test_report.html
    --self-contained-html

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    smoke: Smoke tests
    upload: Tests for upload mode
    live: Tests for live camera mode
    analytics: Tests for analytics

# Coverage
[coverage:run]
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False